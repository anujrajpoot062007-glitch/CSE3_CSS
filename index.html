<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 1: HTML Page Structure and Comments</title>
    <style>
        .box {
            border: 1px solid #b2b2b2;
            padding: 15px;
            width: 450px;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }
        
        .heading {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .aim {
            font-size: 12px;
            color: #333;
            margin-bottom: 15px;
        }

        .output-label {
            font-size: 12px;
            color: #333;
            margin-bottom: 5px;
        }

        .output-box {
            border: 1px solid #cccccc;
            padding: 15px;
            background-color: #ffffff;
        }

        h1 {
            font-size: 20px;
            font-family: serif;
            margin: 0 0 5px 0;
        }

        p {
            font-size: 12px;
            color: #333;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="heading">Assignment 1: HTML Page Structure and Comments</div>
        <div class="aim"><strong>Aim:</strong> To create the basic skeleton of an HTML5 page with a comment.</div>
        <div class="output-label">Output</div>
        
        <div class="output-box">
            <!-- This is a comment: My first HTML page -->
            <h1>Hello, Web!</h1>
            <p>This is my first HTML page.</p>
        </div>
    </div>

</body>
</html>
